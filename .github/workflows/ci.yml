name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/portfolio-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/portfolio-ai/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build -- --configuration production

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn test -B
      - run: mvn package -DskipTests -B
