name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/portfolio-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/portfolio-ai/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  dependency-audit-damage-detector-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: damage-detector-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: damage-detector-app/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  dependency-audit-damage-detector-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: damage-detector-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: damage-detector-api/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  dependency-check-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "portfolio-ai-backend"
          path: "backend/demo"
          format: "HTML"
          args: >
            --failOnCVSS 9
            --enableRetired
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: ["javascript-typescript", "java"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
